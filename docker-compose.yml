services:
  mongodb:
    image: mongo:7
    container_name: portfolio-mongodb
    command: ["mongod", "--quiet"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./server
    container_name: portfolio-backend
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/task-manager
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5000
    container_name: portfolio-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: